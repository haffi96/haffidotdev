name: Preview mywebsite

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - apps/mywebsite/**
      - libraries/shared/**
      - pnpm-lock.yaml
      - .github/workflows/preview-mywebsite.yml

concurrency:
  group: preview-mywebsite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PREVIEW_NAME: haffi-mywebsite-pr-${{ github.event.pull_request.number }}
  PREVIEW_DOMAIN: pr-${{ github.event.pull_request.number }}.preview.haffi.dev

jobs:
  deploy:
    name: Deploy mywebsite preview
    # Secrets are not available to PRs from forks.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds against env.preview, which has no routes, so haffi.dev is never touched.
      - name: Build
        run: pnpm --filter @haffi/mywebsite build
        env:
          CLOUDFLARE_ENV: preview

      - name: Deploy preview Worker
        working-directory: apps/mywebsite
        run: |
          pnpm wrangler deploy \
            --name "$PREVIEW_NAME" \
            --domain "$PREVIEW_DOMAIN" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}"

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-mywebsite
          message: |
            **mywebsite preview:** https://${{ env.PREVIEW_DOMAIN }}

            Deployed `${{ github.event.pull_request.head.sha }}`

  cleanup:
    name: Delete mywebsite preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview Worker
        working-directory: apps/mywebsite
        run: pnpm wrangler delete --name "$PREVIEW_NAME" --force

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-mywebsite
          message: |
            **mywebsite preview** for this PR has been deleted.
